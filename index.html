<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="A simple calculator built by Ajim using HTML, CSS, and JavaScript. Optimized for mobile and desktop." />
  <meta name="keywords" content="Calculator, JavaScript, Bootstrap, HTML, CSS, Ajim" />
  <meta name="author" content="Ajim" />
  <title>CluCalculator - Ajim</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="calculator text-center">
    <form name="form">
      <input type="text" name="Display" class="form-control mb-3" placeholder="0" readonly />
      <div>
        <button type="button" class="btn btn-outline-light" value="1" onclick="addVal(this.value)">1</button>
        <button type="button" class="btn btn-outline-light" value="2" onclick="addVal(this.value)">2</button>
        <button type="button" class="btn btn-outline-light" value="3" onclick="addVal(this.value)">3</button>
        <button type="button" class="btn btn-outline-warning" value="+" onclick="addVal(this.value)">+</button>
      </div>
      <div>
        <button type="button" class="btn btn-outline-light" value="4" onclick="addVal(this.value)">4</button>
        <button type="button" class="btn btn-outline-light" value="5" onclick="addVal(this.value)">5</button>
        <button type="button" class="btn btn-outline-light" value="6" onclick="addVal(this.value)">6</button>
        <button type="button" class="btn btn-outline-warning" value="-" onclick="addVal(this.value)">-</button>
      </div>
      <div>
        <button type="button" class="btn btn-outline-light" value="7" onclick="addVal(this.value)">7</button>
        <button type="button" class="btn btn-outline-light" value="8" onclick="addVal(this.value)">8</button>
        <button type="button" class="btn btn-outline-light" value="9" onclick="addVal(this.value)">9</button>
        <button type="button" class="btn btn-outline-warning" value="*" onclick="addVal(this.value)">*</button>
      </div>
      <div>
        <button type="button" class="btn btn-success" onclick="calculate()">=</button>
        <button type="button" class="btn btn-danger" onclick="clearDisplay()">C</button>
        <button type="button" class="btn btn-outline-warning" value="/" onclick="addVal(this.value)">/</button>
        <button type="button" class="btn btn-outline-light" value="0" onclick="addVal(this.value)">0</button>
      </div>
    </form>
  </div>

  <script>
    function addVal(val) {
      document.form.Display.value += val;
    }

    function calculate() {
      try {
        document.form.Display.value = eval(document.form.Display.value);
      } catch (e) {
        document.form.Display.value = "Error";
      }
    }

    function clearDisplay() {
      document.form.Display.value = '';
    }
  </script>
</body>

</html>
